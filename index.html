   ${[0,1,2,3].map(i=>html`<g key=${i}><line x1="30" x2="600" y1=${20+i*60} y2=${20+i*60} stroke="#e7e5e4" strokeDasharray="4 4"/><text x="0" y=${24+i*60} fontSize="10" fill="#a8a29e">${Math.round(max*(1-i/3))}</text></g>`)}
   ${data.map((d,i)=>{const x=50+i*93;const h1=d[1]/max*180,h2=d[2]/max*180;return html`<g key=${d[0]} onMouseEnter=${()=>setHv(i)} onClick=${()=>setHv(i)}><rect x=${x-6} y="10" width="76" height="220" fill=${hv===i?'#ecfdf5':'transparent'} rx="10"/>
    <rect x=${x} y=${200-h1} width="28" height=${h1} rx="6" fill="#059669"/><rect x=${x+32} y=${200-h2} width="28" height=${h2} rx="6" fill="#f59e0b"/><text x=${x+30} y="222" textAnchor="middle" fontSize="11" fill="#78716c" fontWeight="600">${d[0]}</text></g>`})}</svg>
   ${hv!==null&&html`<div className="absolute top-0 right-2 pop bg-white border border-stone-200 shadow-xl rounded-xl p-3 text-xs"><div className="font-bold text-emerald-900 mb-1">${data[hv][0]} 2026</div><div className="text-emerald-700">Masuk: ${rp(data[hv][1]*1e6)}</div><div className="text-amber-600">Keluar: ${rp(data[hv][2]*1e6)}</div><div className="text-stone-500 mt-1">Selisih: ${rp((data[hv][1]-data[hv][2])*1e6)}</div></div>`}</div></div>

 <div className="mt-4 rounded-3xl bg-white border border-stone-200 shadow-sm overflow-hidden">
  <div className="p-4 md:p-5 flex flex-wrap gap-3 items-center justify-between border-b border-stone-100">
   <div className="relative flex-1 min-w-[200px]"><span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400"><${Ic} n="search" s=${18}/></span><input value=${q} onChange=${e=>setQ(e.target.value)} placeholder="Cari transaksi\u2026" className=${inp+' pl-11'}/></div>
   <div className="flex gap-1 p-1 rounded-xl bg-stone-100">${[['all','Semua'],['in','Pemasukan'],['out','Pengeluaran']].map(([k,l])=>html`<button key=${k} onClick=${()=>setF(k)} className=${'px-3.5 py-2 rounded-lg text-xs font-bold transition '+(f===k?'bg-white text-emerald-800 shadow':'text-stone-500')}>${l}</button>`)}</div></div>
  <div className="divide-y divide-stone-100">${rows.length===0&&html`<div className="p-10 text-center text-stone-400 text-sm">Tidak ada transaksi ditemukan.</div>`}
   ${rows.map(x=>html`<div key=${x.id} className="flex items-center gap-3 px-4 md:px-5 py-4 hover:bg-stone-50 transition"><div className=${'w-10 h-10 shrink-0 rounded-xl grid place-items-center '+(x.t==='in'?'bg-emerald-100 text-emerald-700':'bg-rose-100 text-rose-600')}><${Ic} n=${x.t==='in'?'up':'down'} s=${18}/></div>
    <div className="flex-1 min-w-0"><div className="font-semibold text-sm truncate">${x.n}</div><div className="flex flex-wrap items-center gap-2 mt-1"><span className=${'text-[11px] font-bold px-2 py-0.5 rounded-full '+CAT[x.c]}>${x.c}</span><span className="text-xs text-stone-400">${new Date(x.d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</span></div></div>
    <div className=${'font-bold text-sm whitespace-nowrap '+(x.t==='in'?'text-emerald-600':'text-rose-600')}>${x.t==='in'?'+':'\u2212'} ${rp(x.a)}</div></div>`)}</div></div>

 ${open&&html`<${Modal} onClose=${()=>setOpen(false)}><h3 className="serif text-2xl text-emerald-900">Tambah Transaksi</h3><p className="text-sm text-stone-500 mt-1 mb-5">Simulasi input pengurus. Data tersimpan di peramban ini.</p>
  <div className="space-y-4"><div className="grid grid-cols-2 gap-2">${[['in','Pemasukan'],['out','Pengeluaran']].map(([k,l])=>html`<button key=${k} onClick=${()=>setForm({...form,t:k})} className=${'py-3 rounded-xl text-sm font-bold border transition '+(form.t===k?(k==='in'?'bg-emerald-700 text-white border-emerald-700':'bg-rose-600 text-white border-rose-600'):'bg-white text-stone-500 border-stone-200')}>${l}</button>`)}</div>
   <select value=${form.c} onChange=${e=>setForm({...form,c:e.target.value})} className=${inp}>${Object.keys(CAT).map(c=>html`<option key=${c}>${c}</option>`)}</select>
   <input value=${form.n} onChange=${e=>setForm({...form,n:e.target.value})} placeholder="Keterangan (mis. Infaq Jumat 27 Nov)" className=${inp}/>
   <input value=${form.a} inputMode="numeric" onChange=${e=>setForm({...form,a:e.target.value.replace(/\D/g,'')})} placeholder="Nominal (Rp)" className=${inp}/>
   ${form.a&&html`<div className="text-xs text-emerald-700 font-semibold">${rp(+form.a)}</div>`}
   <button onClick=${submit} className="w-full py-3.5 rounded-2xl bg-emerald-800 text-white font-bold hover:bg-emerald-900 transition">Simpan Transaksi</button></div><//>`}
 </section>`}

function Kajian({setModal,items}){
 const[cat,setCat]=useState('Semua');const list=items.filter(k=>cat==='Semua'||k.k===cat);
 return html`<section id="kajian" className="max-w-6xl mx-auto px-4 pt-20 md:pt-28"><${Head} k="Majelis Ilmu" t="Jadwal Kajian" d="Mari hadiri majelis ilmu bersama para asatidz pilihan."/>
 <div className="flex gap-2 overflow-x-auto pb-2 mb-6 -mx-4 px-4">${['Semua','Fiqih','Akidah','Muamalah','Keluarga'].map(c=>html`<button key=${c} onClick=${()=>setCat(c)} className=${'shrink-0 px-5 py-2.5 rounded-full text-sm font-bold transition '+(cat===c?'bg-emerald-800 text-white shadow-lg':'bg-white border border-stone-200 text-stone-500 hover:border-emerald-300')}>${c==='Keluarga'?'Keluarga/Parenting':c}</button>`)}</div>
 <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">${list.map(k=>html`<article key=${k.id} className="rounded-3xl bg-white border border-stone-200 shadow-sm overflow-hidden hover:-translate-y-1 hover:shadow-xl transition flex flex-col">
  <div className=${'relative p-5 text-white bg-gradient-to-br '+k.g}><div className="absolute inset-0 pat opacity-[.07]"></div>
   <div className="relative flex justify-between items-start"><div className="bg-white/95 text-emerald-900 rounded-2xl px-3.5 py-2 text-center leading-none"><div className="text-[10px] font-bold text-amber-600">${k.day.toUpperCase()}</div><div className="serif text-2xl mt-1">${k.dt}</div><div className="text-[10px] font-semibold text-stone-500">${k.mo}</div></div>
   <span className="flex items-center gap-1.5 text-[11px] font-bold bg-white/20 backdrop-blur px-3 py-1.5 rounded-full">${k.s==='Mendatang'&&html`<span className="relative flex w-2 h-2"><span className="animate-ping absolute inline-flex w-full h-full rounded-full bg-amber-300 opacity-75"></span><span className="relative inline-flex w-2 h-2 rounded-full bg-amber-300"></span></span>`}${k.s}</span></div></div>
  <button onClick=${()=>setModal({type:'kajian',k})} className="group relative block w-full aspect-[4/5] overflow-hidden bg-stone-100" aria-label=${'Lihat poster '+k.t}>${k.img?html`<img src=${k.img} alt=${'Poster '+k.t} className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500"/>`:html`<div className=${'absolute inset-0 grid place-items-center text-white bg-gradient-to-br '+k.g}><div className="absolute inset-0 pat opacity-[.08]"></div><div className="relative text-center px-6"><div className="ar text-4xl text-amber-300">\u0645</div><div className="serif text-lg mt-2">${k.t}</div><div className="text-xs mt-2 opacity-70">Poster segera hadir</div></div></div>`}</button>
  <div className="p-5 flex-1 flex flex-col"><div className="text-[11px] font-bold tracking-widest text-amber-600">${k.k.toUpperCase()}</div><h3 className="font-bold text-lg text-emerald-950 mt-1 leading-snug">${k.t}</h3>
   <div className="flex items-center gap-3 mt-4"><div className="w-10 h-10 rounded-full bg-emerald-100 text-emerald-800 font-bold grid place-items-center text-sm">${k.u.replace(/Ustadz(ah)?\s/,'').split(' ').slice(0,2).map(w=>w[0]).join('')}</div><div className="text-sm font-semibold text-stone-700">${k.u}</div></div>
   <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-stone-500 mt-4"><span className="flex items-center gap-1"><${Ic} n="clock" s=${14}/>${k.time}</span><span className="flex items-center gap-1"><${Ic} n="pin" s=${14}/>${k.loc}</span></div>
   <button onClick=${()=>setModal({type:'kajian',k})} className="mt-5 w-full py-3 rounded-xl bg-emerald-50 text-emerald-800 font-bold text-sm hover:bg-emerald-800 hover:text-white transition">Detail & Pengingat</button></div></article>`)}</div></section>`}

function Programs({setModal,items}){
 return html`<section id="program" className="max-w-6xl mx-auto px-4 pt-20 md:pt-28"><${Head} k="Program Unggulan" t="Berbagi Manfaat untuk Umat" d="Bersama jamaah, kami hadirkan program yang nyata dampaknya."/>
 <div className="grid md:grid-cols-4 gap-5">${items.map(p=>html`<div key=${p.id} className=${'rounded-3xl bg-white border border-stone-200 p-6 shadow-sm hover:-translate-y-1 hover:shadow-xl transition flex flex-col '+(p.span||'md:col-span-1')} style=${p.span?{}:{}}>
  <div className=${'w-14 h-14 rounded-2xl grid place-items-center '+p.c}><${Ic} n=${p.i} s=${26}/></div><h3 className="font-bold text-lg text-emerald-950 mt-4">${p.t}</h3><p className="text-sm text-stone-500 mt-2 leading-relaxed flex-1">${p.d}</p>
  <div className="mt-4 text-sm font-bold text-emerald-800">${p.st}</div>${p.j&&html`<div className="text-xs text-stone-400 mt-0.5">${p.j}</div>`}
  ${p.prog&&html`<div className="mt-3"><div className="h-2.5 rounded-full bg-stone-100 overflow-hidden"><div className="h-full rounded-full bg-gradient-to-r from-emerald-500 to-amber-400" style=${{width:(p.prog[0]/p.prog[1]*100)+'%'}}></div></div><div className="text-xs text-stone-500 mt-1.5">Terkumpul ${p.prog[0]} dari ${p.prog[1]} juta</div></div>`}
  <button onClick=${()=>setModal({type:'infaq',p})} className="mt-5 py-3 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 text-emerald-950 font-bold text-sm hover:shadow-lg transition">Infaq Program</button></div>`)}</div></section>`}

function Qris(){
 const cells=useMemo(()=>{let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;const a=[];for(let y=0;y<25;y++)for(let x=0;x<25;x++){const f=(x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16);if(!f&&r()>.52)a.push([x,y])}return a},[]);
 const fd=(x,y)=>html`<g key=${x+'-'+y}><rect x=${x} y=${y} width="7" height="7" fill="#064e3b"/><rect x=${x+1} y=${y+1} width="5" height="5" fill="#fff"/><rect x=${x+2} y=${y+2} width="3" height="3" fill="#064e3b"/></g>`;
 return html`<svg viewBox="-1 -1 27 27" className="w-44 h-44 mx-auto">${cells.map(([x,y])=>html`<rect key=${x+','+y} x=${x} y=${y} width="1" height="1" fill="#064e3b"/>`)}${fd(0,0)}${fd(18,0)}${fd(0,18)}</svg>`}
function Infaq({p,close,show}){
 const no='7712 3456 7890';
 const copy=()=>{const done=()=>show('Nomor rekening berhasil disalin');try{navigator.clipboard.writeText(no.replace(/ /g,'')).then(done,()=>{fb();done()})}catch(e){fb();done()}};
 const fb=()=>{const t=document.createElement('textarea');t.value=no.replace(/ /g,'');document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(t)};
 return html`<${Modal} onClose=${close} w="max-w-md"><div className="text-xs font-bold tracking-widest text-amber-600">INFAQ PROGRAM</div><h3 className="serif text-2xl text-emerald-900 mt-1">${p.t}</h3>
 <div className="mt-5 p-5 rounded-2xl bg-emerald-50 border border-emerald-100"><${Qris}/><div className="text-center text-xs text-stone-500 mt-2">Simulasi QRIS \u00b7 DKM Masjid Jami Darussalam</div></div>
 <div className="mt-4 p-4 rounded-2xl border border-stone-200"><div className="text-xs text-stone-500">Bank Syariah Indonesia (BSI) \u00b7 a.n. DKM Masjid Jami Darussalam</div><div className="flex items-center justify-between mt-1"><div className="text-xl font-bold tabular-nums text-emerald-900">${no}</div></div></div>
 <button onClick=${copy} className="mt-4 w-full flex items-center justify-center gap-2 py-3.5 rounded-2xl bg-emerald-800 text-white font-bold hover:bg-emerald-900 transition"><${Ic} n="copy" s=${18}/>Salin Nomor Rekening</button>
 <p className="text-xs text-stone-400 text-center mt-3">Jazakumullahu khairan atas kebaikan Anda. Data ini hanya contoh demonstrasi.</p><//>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
